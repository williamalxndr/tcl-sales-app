openapi: 3.1.0
info:
  title: Sales App Foundation API
  version: 0.1.0
  description: Implemented development health endpoints only. The complete implemented API
    is in openapi.yaml; this file remains a compatible health-only subset.
servers:
- url: /api/v1
security: []
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Check application liveness.
      description: Public, no credentials or request body. Standard HEAD/OPTIONS are
        provided by DRF. Does not validate migration state.
      responses:
        '200':
          description: Service is ok.
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - status
                    properties:
                      status:
                        type: string
                        const: ok
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                data:
                  status: ok
                meta:
                  requestId: req_example
        '405':
          description: This method is not allowed.
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: METHOD_NOT_ALLOWED
                  message: This method is not allowed.
                  details: []
                meta:
                  requestId: req_example
        '406':
          description: The requested response format is unavailable.
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_ACCEPTABLE
                  message: The requested response format is unavailable.
                  details: []
                meta:
                  requestId: req_example
  /health/ready:
    get:
      operationId: healthReady
      summary: Check MySQL connectivity.
      description: Public, no credentials or request body. Standard HEAD/OPTIONS are
        provided by DRF. Does not validate migration state.
      responses:
        '200':
          description: Service is ready.
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - status
                    - database
                    properties:
                      status:
                        type: string
                        const: ready
                      database:
                        type: string
                        const: ok
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                data:
                  status: ready
                  database: ok
                meta:
                  requestId: req_example
        '405':
          description: This method is not allowed.
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: METHOD_NOT_ALLOWED
                  message: This method is not allowed.
                  details: []
                meta:
                  requestId: req_example
        '406':
          description: The requested response format is unavailable.
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_ACCEPTABLE
                  message: The requested response format is unavailable.
                  details: []
                meta:
                  requestId: req_example
        '503':
          description: The service is temporarily unavailable.
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
            Retry-After:
              schema:
                type: integer
                const: 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is temporarily unavailable.
                  details: []
                meta:
                  requestId: req_example
components:
  schemas:
    Meta:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          minLength: 1
      required:
      - requestId
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    anyOf:
                    - type: string
                    - type: 'null'
                  code:
                    type: string
                  message:
                    type: string
                required:
                - field
                - code
                - message
          required:
          - code
          - message
          - details
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - error
      - meta
