    post:
      operationId: uploadAttachment
      tags:
      - Program Submission
      summary: Upload one PDF/Excel attachment to an owned draft.
      description: Owner and draft only. Exactly one multipart file, 1–10,000,000 bytes; require If-Match and Idempotency-Key.
        Validate supported PDF/Excel extension and container, bound expanded ZIP size to 100 MB and 10,000 entries,
        ignore claimed MIME. Store private random-key bytes with checksum; respond 202 pending. Worker scans with
        ClamAV before release. Encrypted/uninspectable files remain quarantined; malformed or infected documents are
        rejected. No macros or formulas execute. Fingerprint filename, detected MIME and SHA-256 for identical multipart
        retries. Pending/rejected attachments block submit until clean or removed.
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        description: Immutable submissionId.
        example: sub_0144
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[1-9][0-9]*"$
        description: Quoted submission version from a prior detail/mutation ETag; attachment writes use the parent
          submission version.
        example: '"2"'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Random key for one logical operation; reuse only for an identical retry. Retained for 24 hours.
        example: sales-example-key-0001
      x-allowed-roles: submitter (owner)
      responses:
        '202':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Quoted parent submission version.
            Location:
              schema:
                type: string
              description: Relative URL of the created resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              example:
