        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: BAD_REQUEST
              message: Malformed JSON, unknown parameters, invalid query encoding or missing Idempotency-Key.
              details: []
            meta:
              requestId: req_01salesdesign
    '401':
      description: Credentials or session are invalid or expired.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Correlation ID also returned in meta.requestId.
        Cache-Control:
          schema:
            type: string
            const: no-store
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer challenge; never includes credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Credentials or session are invalid or expired.
              details: []
            meta:
              requestId: req_01salesdesign
    '403':
      description: The authenticated user lacks the required role.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Correlation ID also returned in meta.requestId.
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
