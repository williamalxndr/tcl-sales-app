        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        description: Immutable taskId.
        example: tsk_approve
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[1-9][0-9]*"$
        description: Quoted submission version from a prior detail/mutation ETag; attachment writes use the parent
          submission version.
        example: '"7"'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Random key for one logical operation; reuse only for an identical retry. Retained for 24 hours.
        example: sales-example-key-0001
      x-allowed-roles: Current ready task assignee with matching checker / acknowledger / approver role
      responses:
