  /program-submissions/{submissionId}/submit:
    post:
      operationId: submitSubmission
      tags:
      - Program Submission
      summary: Freeze draft content and start the review chain.
      description: Owner and draft only; require If-Match and Idempotency-Key. Require name, at least one active assigned
        location, both ordered dates, active Checker mapping, one to two eligible Mengetahui and one to three eligible
        Menyetujui. Attachments are optional; every retained attachment must be clean. Require provisioned proposer
        signature. Snapshot identity, master labels, routing, policy and signature; create ordered tasks and activate
        Checker only. Multiple people approve sequentially. Missing type/cost is blocked with 409 WORKFLOW_POLICY_UNRESOLVED
        until requiredness is configured; complete values work now. Unconfirmed self-approval/cross-stage duplicates
        block submit. No automatic reassignment or revision.
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        description: Immutable submissionId.
        example: sub_0144
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[1-9][0-9]*"$
        description: Quoted submission version from a prior detail/mutation ETag; attachment writes use the parent
          submission version.
        example: '"4"'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Random key for one logical operation; reuse only for an identical retry. Retained for 24 hours.
        example: sales-example-key-0001
      x-allowed-roles: submitter (owner)
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
