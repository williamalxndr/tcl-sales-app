        explode: true
      - name: locationId
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 100
        description: Repeat key; submission must match at least one selected location.
        style: form
        explode: true
      - name: programTypeId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        description: Exact type ID; submissions with unknown type do not match.
      - name: periodStartFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive lower bound on execution periodStart; not submittedAt.
      - name: periodStartTo
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive upper bound on execution periodStart; lower bound must not exceed upper bound.
      - name: ownerId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        description: Exact submitter ID.
      - name: checkerId
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 100
        description: Repeat key; match any selected reviewer in this stage of the saved plan. Never widens the caller
          scope.
        style: form
        explode: true
      - name: acknowledgerId
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 100
        description: Repeat key; match any selected reviewer in this stage of the saved plan. Never widens the caller
          scope.
        style: form
        explode: true
      - name: approverId
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 100
        description: Repeat key; match any selected reviewer in this stage of the saved plan. Never widens the caller
          scope.
        style: form
        explode: true
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - -createdAt
          - createdAt
          - -updatedAt
          - updatedAt
          - programNumber
          default: -createdAt
        description: Default -createdAt; append id ascending internally as a stable tie-breaker.
        example: -createdAt
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionListResponse'
              example:
                data:
                - id: sub_0144
                  programNumber: PRG-2026-0144
                  programName: Bundling September Outlet BSD
                  programType: null
                  locations:
                  - id: loc_bsd
                    code: BSD
                    name: BSD
                    isActive: true
                  periodStart: '2026-09-06'
                  periodEnd: '2026-09-20'
                  estimatedCost: null
                  owner:
                    id: usr_rizky
                    fullName: Rizky Pratama
                    jobTitle: Sales Executive
                  status: pendingChecker
                  currentStage: checker
                  createdAt: '2026-08-21T03:00:00Z'
                  updatedAt: '2026-08-21T03:10:00Z'
                  submittedAt: '2026-08-21T03:10:00Z'
                  version: 5
                  myActiveTaskIds:
                  - tsk_checker
                meta:
                  requestId: req_01salesdesign
                  page: 1
                  pageSize: 20
                  totalItems: 1
                  totalPages: 1
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
