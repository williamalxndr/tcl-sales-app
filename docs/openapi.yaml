  /program-submissions/{submissionId}/attachments:
    post:
      operationId: uploadAttachment
      tags:
      - Program Submission
      summary: Upload one PDF/Excel attachment to an owned draft.
      description: 'Allowed roles: submitter (owner). multipart/form-data with exactly one file part; no client
        storage URL. Enforce <= 10,000,000 bytes (A4), extension, detected format and authorization before accepting.
        Save quarantined attachment as pending, increment parent version and return 202. Scanner later marks clean/rejected
        and increments parent version again; read metadata to poll. No download or submit while pending/rejected
        files remain. Draft-only; atomically recheck version/status after streaming.'
      x-allowed-roles: submitter (owner)
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        description: Immutable submissionId.
        example: sub_0144
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[1-9][0-9]*"$
        description: Quoted submission version from a prior detail/mutation ETag; attachment writes use the parent
          submission version.
        example: '"2"'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Random key for one logical operation; reuse only for an identical retry. Retained for 24 hours.
        example: sales-example-key-0001
      responses:
        '202':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Quoted parent submission version.
              example: '"3"'
            Location:
              schema:
                type: string
                format: uri-reference
              description: Created resource metadata URI.
              example: /api/v1/program-submissions/sub_0144/attachments/att_proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              example:
                data:
                  attachment:
                    id: att_proposal
                    submissionId: sub_0144
                    fileName: Proposal Program.pdf
                    contentType: application/pdf
                    sizeBytes: 1800000
                    scanStatus: pending
                    uploadedAt: '2026-08-21T03:06:00Z'
                  submissionVersion: 3
                meta:
                  requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '428':
          $ref: '#/components/responses/428'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: One .pdf, .xls or .xlsx file; <=10,000,000 bytes.
              required:
              - file
            encoding:
              file:
                contentType: application/pdf, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
