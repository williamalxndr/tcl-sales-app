openapi: 3.1.0
info:
  title: Sales Program Submission API
  version: 0.1.0-design
  description: Design contract based on ui-mockup. No backend is implemented. Only sufficiently clear operations
    are in paths. Registration, submit, approve, reject, cancel and dashboard-summary remain provisional in API_DESIGN.md.
    Technical recommendations and authorization policy dependencies are documented there; this is not a production
    release.
servers:
- url: /api/v1
  description: Relative API root; configure the deployment origin in the client.
security:
- bearerAuth: []
tags:
- name: Authentication
- name: User/Profile
- name: Program Submission
- name: Backoffice
- name: Master data
paths:
  /auth/login:
    post:
      operationId: login
      tags:
      - Authentication
      summary: Authenticate an existing active account.
      description: 'Allowed roles: Public. Email comparison is case-insensitive after trimming; never trim passwords.
        Invalid email/password/disabled account use the same 401 response. Credentials are never logged. Lifetime
        values are technical recommendations (A3).'
      x-allowed-roles: Public
      parameters: []
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                data:
                  accessToken: example-access-token-not-a-real-credential
                  tokenType: Bearer
                  expiresIn: 900
                  refreshToken: example-refresh-token-not-a-real-credential
                  refreshExpiresAt: '2026-09-20T03:00:00Z'
                  sessionId: ses_rizky
                  user:
                    id: usr_rizky
                    fullName: Rizky Pratama
                    jobTitle: Sales Executive
                    employeeNumber: B001
                    email: rizky@example.com
                    status: active
                    roles:
                    - submitter
                    timeZone: Asia/Jakarta
                    locationIds:
                    - loc_bsd
                meta:
                  requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: rizky@example.com
              password: example-password-for-documentation
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - Authentication
      summary: Rotate the refresh token and issue a new access token.
      description: 'Allowed roles: Refresh-token holder. Validate the hashed token and session, rotate once, revoke
        the family on reuse. This request uses the refresh credential, not an access bearer token. Serialize refresh
        requests in the client; do not automatically retry on a lost response. Role changes and disabled accounts
        take effect immediately.'
      x-allowed-roles: Refresh-token holder
      parameters: []
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                data:
                  accessToken: example-new-access-token-not-a-real-credential
                  tokenType: Bearer
                  expiresIn: 900
                  refreshToken: example-new-refresh-token-not-a-real-credential
                  refreshExpiresAt: '2026-09-20T03:00:00Z'
                  sessionId: ses_rizky
                  user:
                    id: usr_rizky
                    fullName: Rizky Pratama
                    jobTitle: Sales Executive
                    employeeNumber: B001
                    email: rizky@example.com
                    status: active
                    roles:
                    - submitter
                    timeZone: Asia/Jakarta
                    locationIds:
                    - loc_bsd
                meta:
                  requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: example-refresh-token-not-a-real-credential
  /auth/logout:
    post:
      operationId: logoutSession
      tags:
      - Authentication
      summary: Revoke the current refresh-token family and its access sessions.
      description: 'Allowed roles: Refresh-token holder. No live access token required. Accept current or previously
        rotated token from the family for revocation. Unknown, expired or already revoked tokens return the same
        success; do not expose whether a token existed. Clear client credentials after attempting logout. Other
        device sessions remain active.'
      x-allowed-roles: Refresh-token holder
      parameters: []
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                data:
                  revoked: true
                meta:
                  requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: example-refresh-token-not-a-real-credential
  /users/me:
    get:
      operationId: getMyProfile
      tags:
      - User/Profile
      summary: Load the signed-in profile for the header and auto-filled applicant section.
      description: 'Allowed roles: Any active authenticated role. Only the caller profile. Job title, employee number,
        roles and location scope are managed by trusted provisioning, never by the submission request. No self-service
        profile editing is visible in the designs.'
      x-allowed-roles: Any active authenticated role
      parameters: []
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                data:
                  id: usr_rizky
                  fullName: Rizky Pratama
                  jobTitle: Sales Executive
                  employeeNumber: B001
                  email: rizky@example.com
                  status: active
                  roles:
                  - submitter
                  timeZone: Asia/Jakarta
                  locationIds:
                  - loc_bsd
                meta:
                  requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /master-data/locations:
    get:
      operationId: listLocations
      tags:
      - Master data
      summary: List locations the caller may select.
      description: 'Allowed roles: Any active authenticated role. Return active authorized locations only; BSD and
        Bekasi are seed examples, not a permanent enum. q searches code/name. Server applies organizational scope
        before pagination.'
      x-allowed-roles: Any active authenticated role
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page.
        example: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Items per page.
        example: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Case-insensitive literal substring of location code/name.
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
              example:
                data:
                - id: loc_bsd
                  code: BSD
                  name: BSD
                  isActive: true
                meta:
                  requestId: req_01salesdesign
                  page: 1
                  pageSize: 20
                  totalItems: 1
                  totalPages: 1
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /master-data/program-types:
    get:
      operationId: listProgramTypes
      tags:
      - Master data
      summary: List program types used by read-only filters.
      description: 'Allowed roles: Any active authenticated role. Diskon and Bundling are observed values. This
        endpoint does not settle who assigns a submission type (Q5); type is not writable in draft requests. Return
        active types; old submissions retain snapshots of inactive types.'
      x-allowed-roles: Any active authenticated role
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page.
        example: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Items per page.
        example: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Case-insensitive literal substring of type code/name.
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramTypeListResponse'
              example:
                data:
                - id: typ_bundling
                  code: bundling
                  name: Bundling
                  isActive: true
                - id: typ_diskon
                  code: diskon
                  name: Diskon
                  isActive: true
                meta:
                  requestId: req_01salesdesign
                  page: 1
                  pageSize: 20
                  totalItems: 2
                  totalPages: 1
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /program-submissions:
    get:
      operationId: listMySubmissions
      tags:
      - Program Submission
      summary: List and search only submissions owned by the caller.
      description: 'Allowed roles: submitter (owner). Ownership is server-derived and always applied before filters/counts.
        No ownerId override. Read projections preserve null programType/estimatedCost until their source is defined.
        Unknown or unauthorized filter IDs produce an empty list without disclosing them.'
      x-allowed-roles: submitter (owner)
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page.
        example: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Items per page.
        example: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Trimmed, case-insensitive literal substring of program number or program name; no wildcard
          syntax.
        example: Bundling
      - name: programNumber
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
        description: Exact program number; combines with q using AND.
        example: PRG-2026-0144
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionStatus'
          uniqueItems: true
          maxItems: 7
        description: Repeat key for multiple statuses; OR within this filter.
        style: form
        explode: true
      - name: locationId
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 100
        description: Repeat key; submission must match at least one selected location.
        style: form
        explode: true
      - name: programTypeId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        description: Exact type ID; submissions with unknown type do not match.
      - name: periodStartFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive lower bound on execution periodStart; not submittedAt.
      - name: periodStartTo
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive upper bound on execution periodStart; lower bound must not exceed upper bound.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - -createdAt
          - createdAt
          - -updatedAt
          - updatedAt
          - programNumber
          default: -createdAt
        description: Default -createdAt; append id ascending internally as a stable tie-breaker.
        example: -createdAt
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionListResponse'
              example:
                data:
                - id: sub_0144
                  programNumber: PRG-2026-0144
                  programName: Bundling Idul Adha Outlet BSD
                  programType: null
                  locations:
                  - id: loc_bsd
                    code: BSD
                    name: BSD
                    isActive: true
                  periodStart: '2026-09-06'
                  periodEnd: '2026-09-20'
                  estimatedCost: null
                  owner:
                    id: usr_rizky
                    fullName: Rizky Pratama
                    jobTitle: Sales Executive
                  status: draft
                  currentStage: null
                  createdAt: '2026-08-21T03:00:00Z'
                  updatedAt: '2026-08-21T03:00:00Z'
                  submittedAt: null
                  version: 1
                  myActiveTaskIds: []
                meta:
                  requestId: req_01salesdesign
                  page: 1
                  pageSize: 20
                  totalItems: 1
                  totalPages: 1
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    post:
      operationId: createDraft
      tags:
      - Program Submission
      summary: Create a persisted draft, including an empty draft.
      description: 'Allowed roles: submitter. All body fields optional; {} creates an empty draft with null scalars/empty
        arrays. Owner, status, number, checker, cost, type and timestamps are server-owned. Allocate immutable opaque
        ID and unique human number in one transaction. Validate provided references against confirmed eligibility;
        never use the mockup PEOPLE array as authorization. Missing routing may leave checker null and submissionIssues
        populated. See A1 and Q2/Q5.'
      x-allowed-roles: submitter
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Random key for one logical operation; reuse only for an identical retry. Retained for 24 hours.
        example: sales-example-key-0001
      responses:
        '201':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Quoted parent submission version.
              example: '"1"'
            Location:
              schema:
                type: string
                format: uri-reference
              description: Created resource metadata URI.
              example: /api/v1/program-submissions/sub_0144
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
              example:
                data:
                  id: sub_0144
                  programNumber: PRG-2026-0144
                  programName: Bundling Idul Adha Outlet BSD
                  programType: null
                  locations:
                  - id: loc_bsd
                    code: BSD
                    name: BSD
                    isActive: true
                  periodStart: '2026-09-06'
                  periodEnd: '2026-09-20'
                  estimatedCost: null
                  owner:
                    id: usr_rizky
                    fullName: Rizky Pratama
                    jobTitle: Sales Executive
                  status: draft
                  currentStage: null
                  createdAt: '2026-08-21T03:00:00Z'
                  updatedAt: '2026-08-21T03:00:00Z'
                  submittedAt: null
                  version: 1
                  myActiveTaskIds: []
                  reviewPlan:
                    checker:
                      id: usr_andi
                      fullName: Andi Setiawan
                      jobTitle: Supervisor Sales
                    acknowledgers:
                    - id: usr_dewi
                      fullName: Dewi Larasati
                      jobTitle: Branch Manager BSD
                    approvers:
                    - id: usr_ratna
                      fullName: Ratna Kusuma
                      jobTitle: GM Sales & Marketing
                  reviewTasks: []
                  attachments: []
                  allowedActions:
                  - update
                  - uploadAttachment
                  - downloadPdf
                  submissionIssues:
                  - field: null
                    code: WORKFLOW_POLICY_UNRESOLVED
                    message: Review policy must be confirmed before submission.
                meta:
                  requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftCreate'
            example:
              programName: Bundling Idul Adha Outlet BSD
              locationIds:
              - loc_bsd
              periodStart: '2026-09-06'
              periodEnd: '2026-09-20'
              acknowledgerIds:
              - usr_dewi
              approverIds:
              - usr_ratna
  /program-submissions/{submissionId}:
    get:
      operationId: getMySubmission
      tags:
      - Program Submission
      summary: Read an owned draft or submission, progress and attachment metadata.
      description: 'Allowed roles: submitter (owner). Return 404 for non-owned IDs. Review tasks include all stages
        for the progress/signature display; task eligibility is computed on the backend. Response ETag is the quoted
        parent version. Notes are owner-visible in this proposed contract (Q11).'
      x-allowed-roles: submitter (owner)
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        description: Immutable submissionId.
        example: sub_0144
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Quoted parent submission version.
              example: '"5"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
              example:
                data:
                  id: sub_0144
                  programNumber: PRG-2026-0144
                  programName: Bundling September Outlet BSD
                  programType: null
                  locations:
                  - id: loc_bsd
                    code: BSD
                    name: BSD
                    isActive: true
                  periodStart: '2026-09-06'
                  periodEnd: '2026-09-20'
                  estimatedCost: null
                  owner:
                    id: usr_rizky
                    fullName: Rizky Pratama
                    jobTitle: Sales Executive
                  status: pendingChecker
                  currentStage: checker
                  createdAt: '2026-08-21T03:00:00Z'
                  updatedAt: '2026-08-21T03:10:00Z'
                  submittedAt: '2026-08-21T03:10:00Z'
                  version: 5
                  myActiveTaskIds: []
                  reviewPlan:
                    checker:
                      id: usr_andi
                      fullName: Andi Setiawan
                      jobTitle: Supervisor Sales
                    acknowledgers:
                    - id: usr_dewi
                      fullName: Dewi Larasati
                      jobTitle: Branch Manager BSD
                    approvers:
                    - id: usr_ratna
                      fullName: Ratna Kusuma
                      jobTitle: GM Sales & Marketing
                  reviewTasks:
                  - id: tsk_checker
                    stage: checker
                    reviewer:
                      id: usr_andi
                      fullName: Andi Setiawan
                      jobTitle: Supervisor Sales
                    position: 1
                    status: ready
                    decidedAt: null
                    note: null
                  - id: tsk_know
                    stage: acknowledgement
                    reviewer:
                      id: usr_dewi
                      fullName: Dewi Larasati
                      jobTitle: Branch Manager BSD
                    position: 1
                    status: waiting
                    decidedAt: null
                    note: null
                  - id: tsk_approve
                    stage: approval
                    reviewer:
                      id: usr_ratna
                      fullName: Ratna Kusuma
                      jobTitle: GM Sales & Marketing
                    position: 1
                    status: waiting
                    decidedAt: null
                    note: null
                  attachments:
                  - id: att_proposal
                    submissionId: sub_0144
                    fileName: Proposal Program.pdf
                    contentType: application/pdf
                    sizeBytes: 1800000
                    scanStatus: clean
                    uploadedAt: '2026-08-21T03:06:00Z'
                  allowedActions:
                  - downloadPdf
                  submissionIssues: []
                meta:
                  requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    patch:
      operationId: updateDraft
      tags:
      - Program Submission
      summary: Partially update an owned draft.
      description: 'Allowed roles: submitter (owner). Draft only; 409 SUBMISSION_LOCKED otherwise. Omitted fields
        unchanged; null clears scalar fields; arrays replace the entire selection and [] clears it. A non-null name
        must contain non-whitespace text. Provided dates must be real dates and start <= end when both present.
        Body cannot set status, checker, number, owner, type, cost or tasks. Validate IDs and configured reviewer
        limits. Atomic If-Match; increment version.'
      x-allowed-roles: submitter (owner)
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        description: Immutable submissionId.
        example: sub_0144
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[1-9][0-9]*"$
        description: Quoted submission version from a prior detail/mutation ETag; attachment writes use the parent
          submission version.
        example: '"1"'
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
