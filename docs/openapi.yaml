  /backoffice/filter-options/people:
    get:
      operationId: listBackofficeFilterPeople
      tags:
      - Backoffice
      summary: Populate submitter and reviewer person filters without an unrestricted directory.
      description: 'Allowed roles: checker / acknowledger / approver. Return distinct people referenced in submissions
        in the caller current inbox, before optional filters. field selects owner/checker/acknowledger/approver.
        Names and job title only; no email or employee number. Same role and assignment scope as inbox.'
      x-allowed-roles: checker / acknowledger / approver
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page.
        example: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Items per page.
        example: 20
      - name: field
        in: query
        required: true
        schema:
          type: string
          enum:
          - owner
          - checker
          - acknowledger
          - approver
        description: Which relationship supplies people.
        example: owner
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Case-insensitive substring of fullName/jobTitle.
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterPersonListResponse'
              example:
                data:
                - id: usr_rizky
                  fullName: Rizky Pratama
                  jobTitle: Sales Executive
                meta:
                  requestId: req_01salesdesign
                  page: 1
                  pageSize: 20
                  totalItems: 1
                  totalPages: 1
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque short-lived access token. Roles and object scope are enforced by server policy, not this
        bearer declaration.
  schemas:
    Id:
      type: string
      pattern: ^[a-z][a-z0-9_]{2,63}$
      description: Opaque, immutable ID; clients must not parse its contents.
    Role:
      type: string
      enum:
      - submitter
      - checker
      - acknowledger
      - approver
      - backofficeAdmin
    Stage:
      type: string
      enum:
      - checker
      - acknowledgement
      - approval
    SubmissionStatus:
      type: string
      enum:
      - draft
      - pendingChecker
      - pendingAcknowledgement
      - pendingApproval
      - approved
      - rejected
      - cancelled
    Meta:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          minLength: 1
      required:
      - requestId
    PageMeta:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          minLength: 1
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
      required:
      - requestId
      - page
      - pageSize
      - totalItems
      - totalPages
      - hasNextPage
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    anyOf:
                    - type: string
                    - type: 'null'
                  code:
                    type: string
                  message:
                    type: string
                required:
                - field
                - code
                - message
          required:
          - code
          - message
          - details
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - error
      - meta
    Person:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        jobTitle:
          anyOf:
          - type: string
            maxLength: 150
          - type: 'null'
      required:
      - id
      - fullName
      - jobTitle
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        employeeNumber:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        jobTitle:
          anyOf:
          - type: string
            maxLength: 150
          - type: 'null'
        status:
          type: string
          enum:
          - active
          - disabled
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          uniqueItems: true
        timeZone:
          type: string
        locationIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
      required:
      - id
      - fullName
      - employeeNumber
      - email
      - jobTitle
      - status
      - roles
      - timeZone
      - locationIds
    Location:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        isActive:
          type: boolean
      required:
      - id
      - code
      - name
      - isActive
    ProgramType:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        isActive:
          type: boolean
      required:
      - id
      - code
      - name
      - isActive
    Money:
      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          enum:
          - IDR
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{2})$
          description: Decimal major units, never a floating point number; display formatting is client-side.
      required:
      - currency
      - amount
    ReviewPlan:
      type: object
      additionalProperties: false
      properties:
        checker:
          anyOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        acknowledgers:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        approvers:
          type: array
          items:
            $ref: '#/components/schemas/Person'
      required:
      - checker
      - acknowledgers
      - approvers
    ReviewTask:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        stage:
          $ref: '#/components/schemas/Stage'
        reviewer:
          $ref: '#/components/schemas/Person'
        position:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - waiting
          - ready
          - approved
          - rejected
          - voided
        decidedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
      required:
      - id
      - stage
      - reviewer
      - position
      - status
      - decidedAt
      - note
    Attachment:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        submissionId:
          $ref: '#/components/schemas/Id'
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum:
          - application/pdf
          - application/vnd.ms-excel
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10000000
        scanStatus:
          type: string
          enum:
          - pending
          - clean
          - rejected
        uploadedAt:
          type: string
          format: date-time
      required:
      - id
      - submissionId
      - fileName
      - contentType
      - sizeBytes
      - scanStatus
      - uploadedAt
    SubmissionSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        programNumber:
          type: string
        programName:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
        programType:
          anyOf:
          - $ref: '#/components/schemas/ProgramType'
          - type: 'null'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        periodStart:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        periodEnd:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        estimatedCost:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        owner:
          $ref: '#/components/schemas/Person'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        currentStage:
          anyOf:
          - $ref: '#/components/schemas/Stage'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        version:
          type: integer
          minimum: 1
        myActiveTaskIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
      required:
      - id
      - programNumber
      - programName
      - programType
      - locations
      - periodStart
      - periodEnd
      - estimatedCost
      - owner
      - status
      - currentStage
      - createdAt
      - updatedAt
      - submittedAt
      - version
      - myActiveTaskIds
    Submission:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        programNumber:
          type: string
        programName:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
        programType:
          anyOf:
          - $ref: '#/components/schemas/ProgramType'
          - type: 'null'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        periodStart:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        periodEnd:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        estimatedCost:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        owner:
          $ref: '#/components/schemas/Person'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        currentStage:
          anyOf:
          - $ref: '#/components/schemas/Stage'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        version:
          type: integer
          minimum: 1
        myActiveTaskIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        reviewPlan:
          $ref: '#/components/schemas/ReviewPlan'
        reviewTasks:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTask'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        allowedActions:
          type: array
          items:
            type: string
            enum:
            - update
            - uploadAttachment
            - removeAttachment
            - submit
            - approve
            - reject
            - cancel
            - downloadPdf
          uniqueItems: true
        submissionIssues:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                anyOf:
                - type: string
                - type: 'null'
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
            - message
      required:
      - id
      - programNumber
      - programName
      - programType
      - locations
      - periodStart
      - periodEnd
      - estimatedCost
      - owner
      - status
      - currentStage
      - createdAt
      - updatedAt
      - submittedAt
      - version
      - myActiveTaskIds
      - reviewPlan
      - reviewTasks
      - attachments
      - allowedActions
      - submissionIssues
    DraftCreate:
      type: object
      additionalProperties: false
      properties:
        programName:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
        locationIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 100
        periodStart:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        periodEnd:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        acknowledgerIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 4
        approverIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 5
      required: []
    DraftUpdate:
      type: object
      additionalProperties: false
      properties:
        programName:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
        locationIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 100
        periodStart:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        periodEnd:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        acknowledgerIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 4
        approverIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 5
      required: []
      minProperties: 1
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 2048
      required:
      - refreshToken
    Session:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        sessionId:
          $ref: '#/components/schemas/Id'
        user:
          $ref: '#/components/schemas/User'
      required:
      - accessToken
      - tokenType
      - expiresIn
      - refreshToken
      - refreshExpiresAt
      - sessionId
      - user
    LogoutResult:
      type: object
      additionalProperties: false
      properties:
        revoked:
          const: true
          type: boolean
      required:
      - revoked
    AttachmentRemoval:
      type: object
      additionalProperties: false
      properties:
        attachmentId:
          $ref: '#/components/schemas/Id'
        removed:
          const: true
          type: boolean
        submissionVersion:
          type: integer
          minimum: 1
      required:
      - attachmentId
      - removed
      - submissionVersion
    UploadResult:
      type: object
      additionalProperties: false
      properties:
        attachment:
          $ref: '#/components/schemas/Attachment'
        submissionVersion:
          type: integer
          minimum: 1
      required:
      - attachment
      - submissionVersion
    ReviewerOption:
