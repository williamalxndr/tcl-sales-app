components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque short-lived access token. Roles and object scope are enforced by server policy, not this
        bearer declaration.
  schemas:
    Id:
      type: string
      pattern: ^[a-z][a-z0-9_]{2,63}$
      description: Opaque, immutable ID; clients must not parse its contents.
    Role:
      type: string
      enum:
      - submitter
      - checker
      - acknowledger
      - approver
      - backofficeAdmin
    Stage:
      type: string
      enum:
      - checker
      - acknowledgement
      - approval
    SubmissionStatus:
      type: string
      enum:
      - draft
      - pendingChecker
      - pendingAcknowledgement
