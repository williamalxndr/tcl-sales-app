              code: FORBIDDEN
              message: The authenticated user lacks the required role.
              details: []
            meta:
              requestId: req_01salesdesign
    '404':
      description: Resource does not exist or is outside your authorized scope.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Correlation ID also returned in meta.requestId.
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Resource does not exist or is outside your authorized scope.
              details: []
            meta:
              requestId: req_01salesdesign
    '409':
      description: The operation conflicts with the current resource state.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Correlation ID also returned in meta.requestId.
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: The operation conflicts with the current resource state.
              details: []
            meta:
              requestId: req_01salesdesign
    '412':
      description: The submission changed. Fetch its current version and retry deliberately.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Correlation ID also returned in meta.requestId.
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VERSION_CONFLICT
              message: The submission changed. Fetch its current version and retry deliberately.
              details: []
            meta:
              requestId: req_01salesdesign
    '413':
      description: The file or request exceeds the allowed size.
      headers:
        X-Request-Id:
          schema:
            type: string
