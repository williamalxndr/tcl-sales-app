  /backoffice/program-submissions/{submissionId}/review-tasks/{taskId}/approve:
    post:
      operationId: approveReviewTask
      tags:
      - Backoffice
      summary: Record approval for exactly one assigned review task.
      description: Require task-parent match, current ready assignee and matching reviewer role. If-Match and Idempotency-Key
        protect the atomic transition. Provisioned account signature is required and snapshotted with decision time
        and optional note. Advance one person at a time, first Checker, then all Mengetahui, then all Menyetujui.
        Final approval closes program as approved. Tasks and submitted content cannot be edited. Backend owns next
        status; actor/status/signature bytes are not accepted in body.
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        description: Immutable submissionId.
        example: sub_0144
