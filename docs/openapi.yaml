openapi: 3.1.0
info:
  title: Sales Program Submission API
  version: 0.3.0
  description: Implemented DRF/MySQL API for pre-provisioned employee login, drafts, sequential approvals, private
    uploads, signed PDFs and review history. Cancellation success remains gated pending allowed source states. Flutter
    business screens and future superadmin/dashboard/recovery APIs are outside this backend phase. See API_DESIGN.md
    and BACKEND.md.
servers:
- url: /api/v1
  description: Relative API root; configure the deployment origin in the client.
security:
- bearerAuth: []
tags:
- name: Authentication
- name: User/Profile
- name: Program Submission
- name: Backoffice
- name: Master data
- name: Health
paths:
  /auth/login:
    post:
      operationId: login
      tags:
      - Authentication
      summary: Authenticate an existing active account.
      description: Login only for active, pre-provisioned employees. Normalize email, preserve password bytes, use
        uniform 401 failures. clientType defaults to native. Native returns refreshToken; web returns csrfToken and
        sets an HttpOnly SameSite=Lax refresh cookie, Secure outside development. Web first calls GET /auth/csrf and
        sends its X-CSRFToken with credentials. Origin-bearing login also requires CSRF. Access lasts 15 minutes;
        refresh families have a 30-day absolute expiry. No public registration.
      x-allowed-roles: Public
      parameters:
      - in: header
        name: X-CSRFToken
        required: false
        schema:
          type: string
        description: Required for web/cookie/Origin-bearing requests. Obtain from /auth/csrf, then use the rotated
          token from login.
      - in: cookie
        name: sales_refresh
        required: false
        schema:
          type: string
        description: HttpOnly browser refresh transport. Sent automatically with credentials; do not set it from Flutter
          JavaScript.
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              schema:
                type: string
              description: Browser-only HttpOnly refresh cookie; Secure outside development; SameSite=Lax; Path=/api/v1/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                native:
                  value:
                    data:
                      accessToken: example-access-token-not-a-real-credential
                      tokenType: Bearer
                      expiresIn: 900
                      refreshToken: example-refresh-token-not-a-real-credential
                      refreshExpiresAt: '2026-09-20T03:00:00Z'
                      sessionId: ses_rizky
                      user:
                        id: usr_rizky
                        fullName: Rizky Pratama
                        jobTitle: Sales Executive
                        employeeNumber: B001
                        email: rizky@example.com
                        status: active
                        roles:
                        - submitter
                        timeZone: Asia/Jakarta
                        locationIds:
                        - loc_bsd
                        checkerId: usr_andi
                    meta:
                      requestId: req_01salesdesign
                web:
                  value:
                    data:
                      accessToken: example-access-token-not-a-real-credential
                      tokenType: Bearer
                      expiresIn: 900
                      refreshExpiresAt: '2026-09-20T03:00:00Z'
                      sessionId: ses_rizky
                      user:
                        id: usr_rizky
                        fullName: Rizky Pratama
                        jobTitle: Sales Executive
                        employeeNumber: B001
                        email: rizky@example.com
                        status: active
                        roles:
                        - submitter
                        timeZone: Asia/Jakarta
                        locationIds:
                        - loc_bsd
                        checkerId: usr_andi
                      csrfToken: example-csrf-token-not-a-real-token
                    meta:
                      requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: rizky@example.com
              password: example-password-for-documentation
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - Authentication
      summary: Rotate the refresh token and issue a new access token.
      description: Rotate both access and refresh tokens atomically; the previous access token becomes invalid immediately.
        Native sends refreshToken; web sends {} with sales_refresh cookie and X-CSRFToken. A used refresh token revokes
        the whole family, including the newest access token. Expired, disabled, revoked or wrong-transport sessions
        return 401. Serialize refresh calls in the client.
      x-allowed-roles: Refresh-token holder
      parameters:
      - in: header
        name: X-CSRFToken
        required: false
        schema:
          type: string
        description: Required for web/cookie/Origin-bearing requests. Obtain from /auth/csrf, then use the rotated
          token from login.
      - in: cookie
        name: sales_refresh
        required: false
        schema:
          type: string
        description: HttpOnly browser refresh transport. Sent automatically with credentials; do not set it from Flutter
          JavaScript.
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              schema:
                type: string
              description: Browser-only HttpOnly refresh cookie; Secure outside development; SameSite=Lax; Path=/api/v1/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                native:
                  value:
                    data:
                      accessToken: example-new-access-token-not-a-real-credential
                      tokenType: Bearer
                      expiresIn: 900
                      refreshToken: example-new-refresh-token-not-a-real-credential
                      refreshExpiresAt: '2026-09-20T03:00:00Z'
                      sessionId: ses_rizky
                      user:
                        id: usr_rizky
                        fullName: Rizky Pratama
                        jobTitle: Sales Executive
                        employeeNumber: B001
                        email: rizky@example.com
                        status: active
                        roles:
                        - submitter
                        timeZone: Asia/Jakarta
                        locationIds:
                        - loc_bsd
                        checkerId: usr_andi
                    meta:
                      requestId: req_01salesdesign
                web:
                  value:
                    data:
                      accessToken: example-new-access-token-not-a-real-credential
                      tokenType: Bearer
                      expiresIn: 900
                      refreshExpiresAt: '2026-09-20T03:00:00Z'
                      sessionId: ses_rizky
                      user:
                        id: usr_rizky
                        fullName: Rizky Pratama
                        jobTitle: Sales Executive
                        employeeNumber: B001
                        email: rizky@example.com
                        status: active
                        roles:
                        - submitter
                        timeZone: Asia/Jakarta
                        locationIds:
                        - loc_bsd
                        checkerId: usr_andi
                      csrfToken: example-csrf-token-not-a-real-token
                    meta:
                      requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: example-refresh-token-not-a-real-credential
  /auth/logout:
    post:
      operationId: logoutSession
      tags:
      - Authentication
      summary: Revoke the current refresh-token family and its access sessions.
      description: Revoke the identified session family; repeated logout with a validly shaped but already revoked/unknown
        credential succeeds. Native supplies refreshToken; web uses its HttpOnly cookie and X-CSRFToken, then the
        cookie is cleared. Other sessions are unaffected. Missing credential is 401. Does not require a valid access
        token.
      x-allowed-roles: Refresh-token holder
      parameters:
      - in: header
        name: X-CSRFToken
        required: false
        schema:
          type: string
        description: Required for web/cookie/Origin-bearing requests. Obtain from /auth/csrf, then use the rotated
          token from login.
      - in: cookie
        name: sales_refresh
        required: false
        schema:
          type: string
        description: HttpOnly browser refresh transport. Sent automatically with credentials; do not set it from Flutter
          JavaScript.
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              schema:
                type: string
              description: Browser-only HttpOnly refresh cookie; Secure outside development; SameSite=Lax; Path=/api/v1/auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                data:
                  revoked: true
                meta:
                  requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: example-refresh-token-not-a-real-credential
  /users/me:
    get:
      operationId: getMyProfile
      tags:
      - User/Profile
      summary: Load the signed-in profile for the header and auto-filled applicant section.
      description: Return current authenticated identity, current role grants, assigned locationIds and nullable checkerId.
        Roles and relationships are provisioned by the organization. No public profile editing or account creation.
        No role grants are inferred from job title or staff flags.
      x-allowed-roles: Any active authenticated role
      parameters: []
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                data:
                  id: usr_rizky
                  fullName: Rizky Pratama
                  jobTitle: Sales Executive
                  employeeNumber: B001
                  email: rizky@example.com
                  status: active
                  roles:
                  - submitter
                  timeZone: Asia/Jakarta
                  locationIds:
                  - loc_bsd
                  checkerId: usr_andi
                meta:
                  requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
  /master-data/locations:
    get:
      operationId: listLocations
      tags:
      - Master data
      summary: List locations the caller may select.
      description: Return only active locations explicitly assigned to this account. Search code/name. Location values
        are master records, not permanent enums.
      x-allowed-roles: Any active authenticated role
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          maximum: 2147483647
        description: 1-based page.
        example: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Items per page.
        example: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Case-insensitive literal substring of location code/name.
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
              example:
                data:
                - id: loc_bsd
                  code: BSD
                  name: BSD
                  isActive: true
                meta:
                  requestId: req_01salesdesign
                  page: 1
                  pageSize: 20
                  totalItems: 1
                  totalPages: 1
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
  /master-data/program-types:
    get:
      operationId: listProgramTypes
      tags:
      - Master data
      summary: List active program types for draft selection and filters.
      description: Return active program types, searchable by code/name. Proposer selects a type when editing a draft.
        No master-data write API is exposed.
      x-allowed-roles: Any active authenticated role
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          maximum: 2147483647
        description: 1-based page.
        example: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Items per page.
        example: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Case-insensitive literal substring of type code/name.
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramTypeListResponse'
              example:
                data:
                - id: typ_bundling
                  code: bundling
                  name: Bundling
                  isActive: true
                - id: typ_diskon
                  code: diskon
                  name: Diskon
                  isActive: true
                meta:
                  requestId: req_01salesdesign
                  page: 1
                  pageSize: 20
                  totalItems: 2
                  totalPages: 1
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
  /program-submissions:
    get:
      operationId: listMySubmissions
      tags:
      - Program Submission
      summary: List and search only submissions owned by the caller.
      description: Submitter role plus owner scope. Apply filters before pagination. Search program name/number; execution
        date filters bound periodStart inclusively. OR within repeated filters, AND between filters. Stable sorting
        appends id ascending. Out-of-range pages are empty.
      x-allowed-roles: submitter (owner)
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          maximum: 2147483647
        description: 1-based page.
        example: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Items per page.
        example: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Trimmed, case-insensitive literal substring of program number or program name; no wildcard syntax.
        example: Bundling
      - name: programNumber
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        description: Exact program number; combines with q using AND.
        example: PRG-2026-0144
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionStatus'
          maxItems: 100
        description: Repeat key for multiple statuses; OR within this filter.
        style: form
        explode: true
      - name: locationId
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          maxItems: 100
        description: Repeat key; submission must match at least one selected location.
        style: form
        explode: true
      - name: programTypeId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
        description: Exact type ID; submissions with unknown type do not match.
      - name: periodStartFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive lower bound on execution periodStart; not submittedAt.
      - name: periodStartTo
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive upper bound on execution periodStart; lower bound must not exceed upper bound.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - -createdAt
          - createdAt
          - -updatedAt
          - updatedAt
          - programNumber
          default: -createdAt
        description: Default -createdAt; append id ascending internally as a stable tie-breaker.
        example: -createdAt
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionListResponse'
              example:
                data:
                - id: sub_0144
                  programNumber: PRG-2026-0144
                  programName: Bundling Idul Adha Outlet BSD
                  programType:
                    id: typ_bundling
                    code: bundling
                    name: Bundling
                    isActive: true
                  locations:
                  - id: loc_bsd
                    code: BSD
                    name: BSD
                    isActive: true
                  periodStart: '2026-09-06'
                  periodEnd: '2026-09-20'
                  estimatedCost:
                    currency: IDR
                    amount: '42000000.00'
                  owner:
                    id: usr_rizky
                    fullName: Rizky Pratama
                    jobTitle: Sales Executive
                  status: draft
                  currentStage: null
                  createdAt: '2026-08-21T03:00:00Z'
                  updatedAt: '2026-08-21T03:00:00Z'
                  submittedAt: null
                  version: 1
                  myActiveTaskIds: []
                meta:
                  requestId: req_01salesdesign
                  page: 1
                  pageSize: 20
                  totalItems: 1
                  totalPages: 1
                  hasNextPage: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
    post:
      operationId: createDraft
      tags:
      - Program Submission
      summary: Create a persisted draft, including an empty draft.
      description: Submitter role required. {} creates an empty draft. All supplied references must be active and
        authorized; selected reviewers require explicit per-employee eligibility plus the matching role. Allocate
        PRG-YYYY-NNNN under a MySQL row lock, yearly in Asia/Jakarta. Owner, checker, number, status, timestamps and
        tasks are server-owned. Never derive type/cost from uploaded spreadsheets. Drafts may be incomplete. Inspect
        submissionIssues before submit.
      x-allowed-roles: submitter
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Random key for one logical operation; reuse only for an identical retry. Retained for 24 hours.
        example: sales-example-key-0001
      responses:
        '201':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Server-generated correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Quoted parent submission version.
            Location:
              schema:
                type: string
              description: Relative URL of the created resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
              example:
                data:
                  id: sub_0144
                  programNumber: PRG-2026-0144
                  programName: Bundling Idul Adha Outlet BSD
                  programType:
                    id: typ_bundling
                    code: bundling
                    name: Bundling
                    isActive: true
                  locations:
                  - id: loc_bsd
                    code: BSD
                    name: BSD
                    isActive: true
                  periodStart: '2026-09-06'
                  periodEnd: '2026-09-20'
                  estimatedCost:
                    currency: IDR
                    amount: '42000000.00'
                  owner:
                    id: usr_rizky
                    fullName: Rizky Pratama
                    jobTitle: Sales Executive
                  status: draft
                  currentStage: null
                  createdAt: '2026-08-21T03:00:00Z'
                  updatedAt: '2026-08-21T03:00:00Z'
                  submittedAt: null
                  version: 1
                  myActiveTaskIds: []
                  reviewPlan:
                    checker:
                      id: usr_andi
                      fullName: Andi Setiawan
                      jobTitle: Supervisor Sales
                    acknowledgers:
                    - id: usr_dewi
                      fullName: Dewi Larasati
                      jobTitle: Branch Manager BSD
                    approvers:
                    - id: usr_ratna
                      fullName: Ratna Kusuma
                      jobTitle: GM Sales & Marketing
                  reviewTasks: []
                  attachments: []
                  allowedActions:
                  - update
                  - uploadAttachment
                  - downloadPdf
                  submissionIssues:
                  - field: null
                    code: WORKFLOW_POLICY_UNRESOLVED
                    message: Review policy must be confirmed before submission.
                meta:
                  requestId: req_01salesdesign
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftCreate'
            example:
              programName: Bundling Idul Adha Outlet BSD
              locationIds:
              - loc_bsd
              periodStart: '2026-09-06'
              periodEnd: '2026-09-20'
              acknowledgerIds:
              - usr_dewi
              approverIds:
