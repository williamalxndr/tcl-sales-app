        '503':
          $ref: '#/components/responses/503'
  /backoffice/program-submissions/{submissionId}:
    get:
      operationId: getBackofficeSubmission
      tags:
      - Backoffice
      summary: Read submission details for a current task, including progress and decision targets.
      description: 'Allowed roles: checker / acknowledger / approver (current ready task assignee). Enforce ready-task
        assignment, not global admin status; 404 outside scope. myActiveTaskIds and ready tasks identify taskId
        for the candidate decision endpoints. After acting, refresh the inbox; do not assume continued access to
        the detail (Q8). This read contract can expose existing state while transition operations remain provisional.'
      x-allowed-roles: checker / acknowledger / approver (current ready task assignee)
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        description: Immutable submissionId.
        example: sub_0144
      responses:
        '200':
          description: Successful operation.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Correlation ID.
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
              description: Quoted parent submission version.
              example: '"5"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
              example:
                data:
                  id: sub_0144
                  programNumber: PRG-2026-0144
                  programName: Bundling September Outlet BSD
                  programType: null
                  locations:
                  - id: loc_bsd
