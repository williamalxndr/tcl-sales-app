name: sales_app
description: Cross-platform Sales and Marketing workspace.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.1
  flutter: '>=3.38.3'

dependencies:
  flutter:
    sdk: flutter
  # 3.3.2 is the newest line compatible with the repository's Dart 3.10 SDK.
  flutter_riverpod: ^3.3.2
  # 17.5.0 is the newest line compatible with the repository's Dart 3.10 SDK.
  go_router: ^17.5.0
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  file_picker: ^10.0.0
  file_saver: ^0.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
